name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "dev" ]

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Tải code từ GitHub về máy ảo
        uses: actions/checkout@v3

      - name: 2. Cài đặt môi trường Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 3. Tự động Biên dịch và Đóng gói (Fat JAR)
        run: mvn clean package -DskipTests

      - name: 4. Tự động tạo bản Release trên GitHub
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release Phiên Bản v1.0.${{ github.run_number }}
          body: |
            Hệ thống Đấu giá tự động đóng gói file .jar hoàn chỉnh.
            Chi tiết cập nhật: ${{ github.event.head_commit.message }}
          draft: false
          prerelease: false
          files: target/*-with-dependencies.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}